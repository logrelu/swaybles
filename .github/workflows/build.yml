name: Tests

# The downloadable Mac app is built locally with mac/scripts/make-app.sh and
# attached to Releases by hand. CI only runs the test suites: the legacy
# Electron app is kept for the art pipeline and is never shipped.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: App launch test
        run: xvfb-run -a npm run test:smoke

  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        run: swift test
        working-directory: mac
