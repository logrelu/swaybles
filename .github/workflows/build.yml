name: Build installers

# Tests run on every push. Installers build when you publish a Release
# (attached to it automatically) or via Actions -> Build installers -> Run workflow.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: App launch test
        run: xvfb-run -a npm run test:smoke

  build:
    needs: test
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Mac: ad-hoc signed unless signing secrets are added (see README).
      - name: Build Mac
        if: matrix.target == 'mac'
        shell: bash
        run: |
          if [ -n "$CSC_LINK" ]; then
            npx electron-builder --mac --publish never -c.mac.notarize=true
          else
            npx electron-builder --mac --publish never -c.mac.identity=-
          fi
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build Windows
        if: matrix.target == 'win'
        shell: bash
        run: npx electron-builder --win --publish never
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Check the build
        run: npm run test:build -- ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: Swaybles-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

      - name: Attach installers to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
